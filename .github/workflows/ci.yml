name: ci

# 정수님, 2026-09-09: "정적 코드분석 도구를 사용합니다. 그리고 아키텍처 린터 …
# 그걸 린터처럼 빌드마다 체크합니다."
#
# Every job here FAILS THE BUILD on violation. None of them prints advice. A
# check that only warns is a hope with a log line, and this repository's own
# design notes say so: 「모듈을 작게 유지하자」는 희망이고, 빌드를 깨는 임계값은 장치다.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-targets

  test-windows:
    # The port's only evidence. Nobody here has a Windows machine, so this
    # runner IS the verification: it compiles the named-pipe transport, spawns
    # real ConPTYs, and drives the shipped binary through raw mode and Ctrl-\.
    #
    # ⚠ Every job in this file is GitHub-hosted, deliberately. `ci.yml` runs on
    # `pull_request`, which a fork can trigger — so the office's self-hosted
    # macOS runner belongs in release.yml and must never appear here.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-targets

  principles-are-documented:
    # PRINCIPLES.md §2: a gate nobody has watched go red is a claim, not a
    # control. This applies to the principles document about itself — every
    # `Enforced by:` line names a real CI job, clippy key, denied path, test
    # function, or file. See scripts/check-principles.py's own docstring for
    # how this checker itself failed open twice while being built, and what
    # fixed each one.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-principles.py

  steps-are-documented:
    # 정수님, 2026-09-10: state the desired outcome before building, then record
    # expected AND actual after. `## Actual` must carry a fenced block — the one
    # requirement that cannot be filled from intention, only from having run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-steps.py

  comments-are-short:
    # 정수님, 2026-09-10: "함수/메소드 주석 최대 3줄 이내. 주로 1-2줄." History goes
    # to git log; a comment earns its place only as a caution a reader must not
    # miss. clippy has no line-count lint for this, so the cap is a check here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-comments.py

  install-path-is-consistent:
    # The one-liner in the README is the only place a drift between the build
    # matrix and the installer's platform list shows up — in a user's terminal,
    # as a 404, after we shipped. Nothing else in the build compares a shell
    # script against a YAML matrix.
    #
    # There are two installers now (a `uname` case arm cannot run on Windows),
    # so there are two syntax checks: `sh -n` and the PowerShell parser. pwsh is
    # preinstalled on the ubuntu image, so this stays one job on one runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-install.py
      - run: sh -n docs/install.sh
      - run: pwsh -NoProfile -File scripts/check-powershell.ps1

  nightly-stale-index:
    # latest.json is cached for up to ten minutes, but the nightly tag is
    # fixed and every release replaces its assets — so a real install can hit
    # a version string that no longer names anything downloadable. See
    # scripts/check-nightly-stale-index.sh's own header for how this is
    # provoked without waiting for the real race.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-nightly-stale-index.sh

  cold-install:
    # No stable release has ever been published — latest.json carries
    # "stable":"0.0.0", a placeholder. See scripts/check-cold-install.sh's
    # own header for what this proves: a cold stable install fails with an
    # actionable message, not a raw 404, and does not silently fall back.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/check-cold-install.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  lint:
    # Static analysis AND the architecture linter. `clippy.toml` next to
    # `core/Cargo.toml` denies the std paths the wasm gate was measured NOT to
    # catch, plus the size thresholds R15 actually asks for. `-D warnings` is
    # what turns all of it from a report into a gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo clippy --workspace --all-targets -- -D warnings

  cargo-audit:
    # Plain `cargo audit` exits 0 on `unmaintained`/`unsound`/`yanked`
    # advisories — only `--deny warnings` turns those into a failed build.
    # A gate that passes on the thing it exists to catch is theatre.
    #
    # A red here can appear with no commit of ours, because RustSec
    # publishes advisories on its own schedule. That is correct behavior,
    # not a flake: read the advisory and bump the crate, don't just re-run
    # the job. If no patched version exists yet (`unmaintained` advisories
    # often have none), the only moves are replacing the crate, or
    # `cargo audit --ignore RUSTSEC-XXXX-NNNN` with a comment naming a
    # dated expiry to revisit — never ignore with no expiry.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Report crate and finding counts
        run: |
          cargo audit --json > audit.json
          crates=$(jq -r '.lockfile."dependency-count"' audit.json)
          vulns=$(jq -r '.vulnerabilities.count' audit.json)
          warns=$(jq -r '[.warnings[]? | length] | add // 0' audit.json)
          {
            echo "### cargo audit"
            echo "- crates scanned: $crates"
            echo "- vulnerabilities: $vulns"
            echo "- warnings (unmaintained/unsound/yanked/notice): $warns"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate on findings
        run: cargo audit --no-fetch --deny warnings

  wasm-boundary:
    # The policy layer must build for a target that has no fork, no pty, no tty.
    # This catches a host CRATE leaking into core — the axis portable-pty sits
    # on. It does NOT catch a hand-written syscall; that is the `lint` job's
    # half. Both, because the gap between them was measured, not assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p remuda-core --target wasm32-unknown-unknown

  gates-can-fail:
    # A gate nobody has watched go red is a claim, not a control.
    #
    # Each step plants the violation its gate exists to catch and asserts the
    # gate rejects it — then reverts. If someone silences a lint, this job goes
    # red instead of the guard going quiet.
    #
    # ⚠ EVERY STEP MATCHES THE REJECTION *REASON*, NEVER JUST "IT FAILED".
    # The first draft of this job asserted only non-zero exit, and it passed for
    # the wrong reason on its very first local run: a `>>` appended a dependency
    # line into the trailing `[lints]` table, so cargo died on `unknown variant
    # '../native'` — a TOML syntax error — and the check happily reported the
    # architecture rule was alive. A negative control that accepts any failure
    # also accepts your own typo. Grep for the message the gate itself emits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown

      - name: clippy rejects a syscall written into the policy layer
        run: |
          cp core/src/lib.rs /tmp/lib.rs.bak
          echo 'pub fn _leak() { let _ = std::process::Command::new("ls"); }' >> core/src/lib.rs
          cargo clippy -p remuda-core --all-targets -- -D warnings 2>&1 | tee /tmp/out || true
          cp /tmp/lib.rs.bak core/src/lib.rs
          grep -q "disallowed type .std::process::Command" /tmp/out \
            || { echo "::error::clippy did not reject Command for the stated reason"; exit 1; }

      - name: the wasm target rejects a platform API in the policy layer
        run: |
          cp core/src/lib.rs /tmp/lib.rs.bak
          echo 'pub fn _leak(f: &std::fs::File) -> i32 { use std::os::unix::io::AsRawFd; f.as_raw_fd() }' >> core/src/lib.rs
          cargo check -p remuda-core --target wasm32-unknown-unknown 2>&1 | tee /tmp/out || true
          cp /tmp/lib.rs.bak core/src/lib.rs
          grep -q "os::unix" /tmp/out \
            || { echo "::error::wasm target did not reject std::os::unix"; exit 1; }

      - name: cargo rejects an edge from the policy layer back to the host layer
        # Note the exact claim: this proves the arrow cannot be REVERSED (cargo
        # calls it a cycle). It does NOT prove core is free of host crates in
        # general — a brand-new host dependency is caught by `wasm-boundary`
        # above, which is why both jobs exist.
        run: |
          cp core/Cargo.toml /tmp/Cargo.toml.bak
          sed -i 's|^\[dependencies\]$|[dependencies]\nremuda-native = { path = "../native" }|' core/Cargo.toml
          cargo check -p remuda-core 2>&1 | tee /tmp/out || true
          cp /tmp/Cargo.toml.bak core/Cargo.toml
          grep -q "cyclic package dependency" /tmp/out \
            || { echo "::error::cargo did not reject the reversed edge as a cycle"; exit 1; }

      - name: a renamed Lua binding breaks the frozen API script
        # The hole this closes, stated as a plant: rename a binding AND its
        # entry in BINDINGS — the tidy thing a developer does — and the surface
        # test still passes, because both sides moved together. Only a script
        # written against the old API notices, which is why one is frozen in
        # native/tests/api/ and never edited to make it pass.
        run: |
          cp native/src/script.rs /tmp/script.rs.bak
          sed -i 's/"insert"/"insert_bytes"/g' native/src/script.rs
          cargo test -p remuda-native --test script 2>&1 | tee /tmp/out || true
          cp /tmp/script.rs.bak native/src/script.rs
          grep -q "the_bound_surface_is_exactly_the_protocols ... ok" /tmp/out \
            || { echo "::error::the surface test was supposed to STAY GREEN under a clean rename"; exit 1; }
          grep -q "remuda.insert is gone" /tmp/out \
            || { echo "::error::the frozen v1 script did not catch the rename"; exit 1; }

      - name: check-principles.py rejects a mechanism that does not exist
        # Built 2026-09-10 and it failed open TWICE while being built: once on
        # a phantom `push:` job name (indented like a job under `jobs:` but
        # isn't), once on a second backticked name sharing a line with the
        # first (the checker read only the field's opening line). Both are in
        # the script's own docstring. This step is the permanent proof the
        # fixed version still rejects a broken reference.
        run: |
          cp PRINCIPLES.md /tmp/PRINCIPLES.md.bak
          sed -i 's/CI job `wasm-boundary`/CI job `no-such-job`/' PRINCIPLES.md
          if python3 scripts/check-principles.py 2>/tmp/out; then
            echo "::error::check-principles.py ACCEPTED a CI job name that ci.yml does not define"
            cp /tmp/PRINCIPLES.md.bak PRINCIPLES.md
            exit 1
          fi
          cp /tmp/PRINCIPLES.md.bak PRINCIPLES.md
          grep -q "no-such-job" /tmp/out \
            || { echo "::error::check-principles.py rejected for the wrong reason"; exit 1; }

      - name: check-steps.py rejects a step with no captured evidence
        # The interesting failure is not a missing section — it is a step doc
        # whose Actual is confident prose about what surely happened. That is
        # the one this fence catches.
        run: |
          cp steps/001-pty-manager-daemon.md /tmp/step.bak
          python3 - <<'EOF'
          import pathlib
          p = pathlib.Path("steps/001-pty-manager-daemon.md")
          t = p.read_text()
          assert "```" in t, "probe text not found — the control never ran"
          p.write_text(t.replace("```", "~~~"))
          EOF
          if python3 scripts/check-steps.py 2>/tmp/out; then
            echo "::error::check-steps.py ACCEPTED a step with no captured output"
            cp /tmp/step.bak steps/001-pty-manager-daemon.md
            exit 1
          fi
          cp /tmp/step.bak steps/001-pty-manager-daemon.md
          grep -q "no fenced block" /tmp/out \
            || { echo "::error::check-steps.py rejected for the wrong reason"; exit 1; }

      - name: check-steps.py rejects two steps claiming one number
        # Two branches in flight both take the next number and git merges them
        # without a conflict, so nothing but this notices.
        run: |
          taken=$(ls steps/ | head -1 | cut -d- -f1)
          cp "steps/$(ls steps/ | head -1)" "steps/$taken-a-second-claim.md"
          if python3 scripts/check-steps.py 2>/tmp/out; then
            echo "::error::check-steps.py ACCEPTED two steps on number $taken"
            rm -f "steps/$taken-a-second-claim.md"
            exit 1
          fi
          rm -f "steps/$taken-a-second-claim.md"
          grep -q "is claimed by 2" /tmp/out \
            || { echo "::error::check-steps.py rejected for the wrong reason"; exit 1; }

      - name: check-comments.py rejects a doc comment over the cap
        # The control that matters is not "it fails" — a broken glob also fails.
        # It is that the checker still SEES the comments it is meant to measure.
        run: |
          python3 scripts/check-comments.py \
            || { echo "::error::tree was already over cap — this control proves nothing"; exit 1; }
          cp core/src/clock.rs /tmp/clock.bak
          # printf, not a heredoc: a heredoc body has to start at column 0, which
          # ENDS the YAML block scalar this step lives in. That is not a style
          # point — it is what silently disabled this entire file (see step 009).
          printf '\n/// one\n/// two\n/// three\n/// four\npub fn ci_probe_over_cap() {}\n' \
            >> core/src/clock.rs
          if python3 scripts/check-comments.py 2>/tmp/out; then
            echo "::error::check-comments.py ACCEPTED a doc comment over the cap"
            cp /tmp/clock.bak core/src/clock.rs
            exit 1
          fi
          cp /tmp/clock.bak core/src/clock.rs
          grep -q "core/src/clock.rs" /tmp/out \
            || { echo "::error::check-comments.py rejected for the wrong reason"; exit 1; }

      - name: check-install.py rejects a platform the release does not build
        # The plant is the realistic mistake: someone adds an arm64 Linux arm to
        # the installer's `uname` case and does not touch the build matrix. The
        # one-liner then 404s for exactly those users and for nobody else.
        run: |
          python3 scripts/check-install.py \
            || { echo "::error::the tree already disagreed — this control proves nothing"; exit 1; }
          cp docs/install.sh /tmp/install.bak
          sed -i 's|^Linux/x86_64) target=x86_64-unknown-linux-gnu ;;|Linux/x86_64) target=x86_64-unknown-linux-gnu ;;\nLinux/aarch64) target=aarch64-unknown-linux-gnu ;;|' docs/install.sh
          grep -q 'aarch64-unknown-linux-gnu' docs/install.sh \
            || { echo "::error::the plant did not apply — this control never ran"; exit 1; }
          if python3 scripts/check-install.py 2>/tmp/out; then
            echo "::error::check-install.py ACCEPTED a target nothing builds"
            cp /tmp/install.bak docs/install.sh
            exit 1
          fi
          cp /tmp/install.bak docs/install.sh
          grep -q "release.yml does not build it" /tmp/out \
            || { echo "::error::check-install.py rejected for the wrong reason"; exit 1; }

      - name: check-install.py rejects a Windows target the release does not build
        # The mirror of the plant below, on the other installer. The realistic
        # mistake is an arm64 Windows arm added to the hashtable and not to the
        # matrix — and it has to be caught by NAME, because install.ps1 and
        # install.sh hold disjoint halves of one platform list.
        run: |
          python3 scripts/check-install.py \
            || { echo "::error::the tree already disagreed — this control proves nothing"; exit 1; }
          cp docs/install.ps1 /tmp/install.ps1.bak
          sed -i "s|^    'AMD64' = 'x86_64-pc-windows-msvc'|    'AMD64' = 'x86_64-pc-windows-msvc'\n    'Arm64' = 'aarch64-pc-windows-msvc'|" docs/install.ps1
          grep -q "aarch64-pc-windows-msvc" docs/install.ps1 \
            || { echo "::error::the plant did not apply — this control never ran"; exit 1; }
          if python3 scripts/check-install.py 2>/tmp/out; then
            echo "::error::check-install.py ACCEPTED a Windows target nothing builds"
            cp /tmp/install.ps1.bak docs/install.ps1
            exit 1
          fi
          cp /tmp/install.ps1.bak docs/install.ps1
          grep -q "install.ps1 offers aarch64-pc-windows-msvc" /tmp/out \
            || { echo "::error::check-install.py rejected for the wrong reason"; exit 1; }

      - name: the PowerShell parser rejects a broken installer
        # The `sh -n` lesson, on the other script: plant something the gate
        # actually READS. A truncated `try {` is a parse error; a bad cmdlet
        # name would not be, and would pass here exactly as `[ -z "$x"` did.
        run: |
          pwsh -NoProfile -File scripts/check-powershell.ps1 \
            || { echo "::error::install.ps1 was already broken — this control proves nothing"; exit 1; }
          cp docs/install.ps1 /tmp/install.ps1.bak
          printf '\ntry {\n  Write-Host oops\n' >> docs/install.ps1
          if pwsh -NoProfile -File scripts/check-powershell.ps1 >/tmp/out 2>&1; then
            echo "::error::the PowerShell parser ACCEPTED an unterminated try block"
            cp /tmp/install.ps1.bak docs/install.ps1
            exit 1
          fi
          cp /tmp/install.ps1.bak docs/install.ps1
          grep -q "install.ps1: syntax error" /tmp/out \
            || { echo "::error::check-powershell.ps1 rejected for the wrong reason"; exit 1; }

      - name: sh -n rejects a broken installer
        # ⚠ The first draft of this plant was `if [ -z "$x" ; then` and `sh -n`
        # said OK — correctly: `[ -z "$x"` is a valid *command*, and the missing
        # `]` is a runtime failure, not a parse error. A control has to plant
        # something the gate actually reads. This one truncates an `if`.
        run: |
          cp docs/install.sh /tmp/install.bak
          printf '\nif [ -z "$x" ]; then\n  echo oops\n' >> docs/install.sh
          if sh -n docs/install.sh 2>/tmp/out; then
            echo "::error::sh -n ACCEPTED an unterminated if"
            cp /tmp/install.bak docs/install.sh
            exit 1
          fi
          cp /tmp/install.bak docs/install.sh
          grep -qi "syntax error" /tmp/out \
            || { echo "::error::sh -n rejected for the wrong reason"; exit 1; }

      - name: check-workflows.py rejects a workflow that would start no jobs
        # This plants the REAL 2026-09-10 incident, not an approximation of it:
        # a heredoc body at column 0 inside an indented block. That is what
        # stopped ci.yml parsing, and a file that does not parse starts zero
        # jobs — including this one, which is why the guard lives elsewhere.
        # Planted with printf on purpose; a heredoc here would re-lay the trap.
        run: |
          python3 scripts/check-workflows.py \
            || { echo "::error::a workflow was already broken — this control proves nothing"; exit 1; }
          cp .github/workflows/ci.yml /tmp/ci.bak
          printf "      - run: cat <<'X'\nnot indented\nX\n" >> .github/workflows/ci.yml
          if python3 scripts/check-workflows.py 2>/tmp/out; then
            echo "::error::check-workflows.py ACCEPTED a file that does not parse"
            cp /tmp/ci.bak .github/workflows/ci.yml
            exit 1
          fi
          cp /tmp/ci.bak .github/workflows/ci.yml
          grep -q "ci.yml: does not parse as YAML" /tmp/out \
            || { echo "::error::check-workflows.py rejected for the wrong reason"; exit 1; }

      - name: the suite still passes once every leak is reverted
        run: cargo test --workspace --all-targets
