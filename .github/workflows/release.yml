name: release

# Two channels, ONE workflow, because the thing that breaks an installer is two
# build matrices drifting apart. `scripts/check-install.py` also asserts this
# matrix matches the triples docs/install.sh offers.
#
#   push a tag v1.2.3  →  release "v1.2.3", marked latest      (stable)
#   push to main       →  rolling release "nightly", prerelease (nightly)
#
# The publish job writes the new version into docs/latest.json on main, which
# GitHub Pages serves. `paths-ignore` is what stops that commit from starting
# another nightly.
#
# ⚠ THERE IS NO `pull_request:` TRIGGER HERE, AND THERE MUST NEVER BE ONE.
# The macOS build runs on a physical machine in the office (see that job). A
# fork's pull request running on it would execute a stranger's code on hardware
# we own. `workflow_dispatch` is safe by contrast — only someone with write
# access to this repository can start one.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - docs/latest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      targets: ${{ steps.v.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        # Derived, never hand-maintained. `dist::is_newer` sorts the prerelease
        # LEXICALLY, and a sha has no order — so the stamp is to the SECOND, not
        # the day, or two nightlies of one day rank by sha, i.e. by coin flip.
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME"  >> "$GITHUB_OUTPUT"
            echo "channel=stable"        >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            version="$base-nightly.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short=7 HEAD)"
            echo "tag=nightly"    >> "$GITHUB_OUTPUT"
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version" >&2

          # The matrix below is the single source of truth for which platforms
          # exist; `publish` reads this rather than a second hand-kept list,
          # because a second list is precisely what principle 11 is about.
          targets=$(sed -n 's/^ *- target: \(.*\)$/\1/p' .github/workflows/release.yml | tr '\n' ' ')
          [ -n "$targets" ] || { echo "::error::no build targets parsed"; exit 1; }
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "targets: $targets" >&2

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every entry here has been built by a real runner, and that bar is the
          # rule: `publish` is strict, so a target no runner picks up withholds
          # ALL assets, and a permanently-queued job looks merely slow.
          # `macos-13` proved it — run 34438277779, 27 minutes with
          # `started_at == created_at` and no runner, and nothing shipped.
          #
          # `[self-hosted, macOS, ARM64]` (warmblood-macbook-runner-1, a PHYSICAL
          # office machine) failed the SAME way for this repo: run 34443114624,
          # both macOS jobs 11 minutes with an empty `runner_name`, while linux
          # and windows built beside them. A runner group must admit a PUBLIC
          # repo and that is an org admin's call, so macOS stays on GitHub's
          # runner — free here, measured: `billable.MACOS.total_ms = 0`.
          # Intel mac waits for a host that can answer whether mlua's vendored
          # C cross-compiles from arm64; nobody has built it yet.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04 # older glibc → runs on more distros
            bin: remuda
          - target: aarch64-apple-darwin
            os: macos-14
            bin: remuda
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: remuda.exe
    runs-on: ${{ matrix.os }}
    # A self-hosted runner can be busy, offline, or simply not permitted to
    # serve this repository, and GitHub leaves such a job QUEUED rather than
    # failing it. A bound turns "never starts" into a red job someone can read.
    timeout-minutes: 45
    defaults:
      run:
        # One script for four targets. Git for Windows puts bash on the hosted
        # image, so `tar`, `set -eu` and `$(…)` mean the same thing everywhere
        # and nothing below needs a per-OS spelling.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: put the toolchain on PATH
        # The self-hosted runner is a launchd service and does not source a
        # shell profile, so an interactively-installed rustup is invisible to
        # it. Harmless on the hosted images, where this is already the PATH.
        if: runner.os == 'macOS'
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: rustup target add ${{ matrix.target }}
      - name: build
        env:
          REMUDA_VERSION: ${{ needs.plan.outputs.version }}
        run: cargo build --release --bin remuda --target ${{ matrix.target }}

      - name: the binary reports the version it was built with
        # A build-time env var that silently fails to reach the binary produces
        # a release whose assets are named one thing and whose --version says
        # another. Cheap to assert here, invisible otherwise.
        #
        # Skipped for the cross-compiled Intel slice: this host cannot run it.
        # That is the honest cost of building x86_64 on Apple Silicon, and it is
        # stated rather than hidden — no other target is exempt.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          set -eu
          got=$(./target/${{ matrix.target }}/release/${{ matrix.bin }} --version)
          [ "$got" = "remuda ${{ needs.plan.outputs.version }}" ] \
            || { echo "::error::--version said '$got'"; exit 1; }

      - name: package
        run: |
          set -eu
          name="remuda-${{ needs.plan.outputs.version }}-${{ matrix.target }}"
          mkdir -p dist
          tar -czf "dist/$name.tar.gz" -C "target/${{ matrix.target }}/release" ${{ matrix.bin }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

      - name: leave the shared machine as we found it
        # The office runner is persistent and shared with other repositories.
        # `actions/checkout` cleans the tree on the way IN, which is too late to
        # stop a release-sized `target/` sitting there until the next run.
        if: always() && runner.os == 'macOS'
        run: rm -rf target dist

  publish:
    needs: [plan, build]
    # `always()` so this job RUNS when a build did not. Skipped-because-a-
    # dependency-failed is the silence that cost an hour on 2026-09-10: nobody
    # was told which target was missing, only that the release did not appear.
    #
    # `workflow_dispatch` exists so a branch can PROVE the build matrix on real
    # runners before it is merged. Publishing from a branch would be a different
    # thing entirely — it would delete and replace the rolling `nightly` release
    # with a build of unmerged code, and push to main. So the matrix runs
    # anywhere and only main or a tag publishes.
    if: |
      always() && needs.plan.result == 'success'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: every offered platform has an asset, or nothing ships
        # WHY THIS REFUSES INSTEAD OF PUBLISHING WHAT BUILT.
        #
        # "3 of 4 beats 0 of 4" is the obvious reading, and it is wrong here.
        # Work the two cases through from a USER's side, for the case that will
        # actually recur — the self-hosted macOS runner busy or offline:
        #
        #   partial   nightly is a ROLLING tag, so publishing means deleting the
        #             release and recreating it. The three assets go up, the mac
        #             one is GONE, and latest.json advances. A mac user's next
        #             `remuda upgrade` resolves the new version and 404s. We
        #             took away a build they could have installed a minute ago.
        #   strict    nothing is deleted, latest.json does not move. Every
        #             platform keeps installing the last complete build. Linux
        #             and Windows are one build STALE until the next push.
        #
        # Staleness on a rolling channel is invisible; a 404 from the one-liner
        # the README promises is not. `check-install.py`'s standing promise is
        # that every offered platform has an asset, and a partial publish breaks
        # it for real people rather than in theory.
        #
        # So the strict path is the one that degrades gracefully, and what was
        # wrong on 2026-09-10 was never strictness — it was SILENCE. `publish`
        # was skipped, so nobody was told which target was missing. Hence
        # always() above and the job summary below.
        #
        # ⚠ This reasoning depends on nightly being a rolling tag that is
        # deleted and recreated. Change that, and revisit this decision.
        env:
          EXPECTED: ${{ needs.plan.outputs.targets }}
        run: |
          set -eu
          missing=""
          for target in $EXPECTED; do
            # Artifacts land as staged/<target>/remuda-<version>-<target>.tar.gz.
            ls staged/"$target"/*.tar.gz >/dev/null 2>&1 || missing="$missing $target"
          done
          if [ -n "$missing" ]; then
            {
              echo "## Release withheld — incomplete build matrix"
              echo
              echo "No asset was produced for:"
              for target in $missing; do echo "- \`$target\`"; done
              echo
              echo "Nothing was published and nothing was deleted, so the previous"
              echo "complete release keeps serving every platform. Fix the failing"
              echo "or unassigned build and re-run; do not publish a partial set."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::no asset for$missing — refusing to publish a partial release"
            exit 1
          fi
          echo "all $(echo $EXPECTED | wc -w) targets produced an asset" >> "$GITHUB_STEP_SUMMARY"

      - name: collect and checksum
        run: |
          set -eu
          mkdir -p dist
          find staged -type f -name '*.tar.gz' -exec mv {} dist/ \;
          # Plain names, no `./` prefix, so `sha256sum -c SHA256SUMS` works for
          # a human in the download directory too.
          cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          if [ "${{ needs.plan.outputs.channel }}" = nightly ]; then
            # Rolling: delete the old one so "nightly" always names today's.
            gh release delete "$TAG" --yes --cleanup-tag || true
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "nightly $VERSION" \
              --notes "Rolling build of main. Version \`$VERSION\`." dist/*
          else
            gh release create "$TAG" --latest --title "$TAG" \
              --generate-notes dist/*
          fi

      - name: publish the version index
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, datetime, pathlib
          p = pathlib.Path("docs/latest.json")
          index = json.loads(p.read_text())
          index[os.environ["CHANNEL"]] = os.environ["VERSION"]
          index["updated"] = datetime.datetime.now(datetime.timezone.utc).isoformat(
              timespec="seconds"
          ).replace("+00:00", "Z")
          p.write_text(json.dumps(index, indent=2) + "\n")
          print(p.read_text())
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "release: $CHANNEL is now $VERSION"
          git pull --rebase origin main
          git push origin HEAD:main
