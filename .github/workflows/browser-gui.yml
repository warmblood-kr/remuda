name: browser-gui

on:
  pull_request:
    paths: &browser_paths
      - '.github/workflows/browser-gui.yml'
      - 'gui/**'
      - 'core/**'
      - 'native/**'
      - 'vendor/**'
      - 'Cargo.*'
  push:
    branches: [main]
    paths: *browser_paths

concurrency:
  group: browser-gui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Browser for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Release packages are built and checked separately in release.yml.
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            executable: remuda-gui
            cli: remuda
          - platform: windows-x64
            runner: windows-latest
            executable: remuda-gui.exe
            cli: remuda.exe
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (!$fxc) { throw 'Windows SDK shader compiler fxc.exe was not found' }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: browser-ci-${{ matrix.platform }}
          workspaces: |
            . -> target
            gui -> target
          env-vars: GPUI_FXC_PATH
          cache-bin: false
          save-if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Build Browser
        run: cargo build --locked --manifest-path gui/Cargo.toml
      - name: Verify Windows provider, Kit composer and scrollbar
        if: runner.os == 'Windows'
        run: >-
          cargo test --locked --manifest-path gui/Cargo.toml --bin remuda-gui
          -- provider::windows_tests line_input::tests
          composer_keys_edit_lines_and_restore_draft_after_recalling_history
          session_sidebar_scrolls_without_scrolling_the_terminal
      - run: cargo build --locked -p remuda-native --bin remuda
      - name: Read sessions through the Windows local node
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP ('remuda-gui-' + [guid]::NewGuid()))
          foreach ($entry in @{ REMUDA_RUNTIME_DIR='run'; XDG_CONFIG_HOME='config'; XDG_DATA_HOME='data'; XDG_STATE_HOME='state'; XDG_CACHE_HOME='cache' }.GetEnumerator()) {
            [Environment]::SetEnvironmentVariable($entry.Key, (Join-Path $root.FullName $entry.Value))
          }
          $env:REMUDA_NO_UPDATE_CHECK = '1'
          $daemon = Start-Process -FilePath ./target/debug/${{ matrix.cli }} -ArgumentList daemon -PassThru
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $sessions = & ./gui/target/debug/${{ matrix.executable }} --internal-list-worker
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Milliseconds 200
            }
            if ($LASTEXITCODE -ne 0 -or $sessions -ne '[]') { throw 'GUI could not read the local node session list' }
            $nodes = & ./gui/target/debug/${{ matrix.executable }} --internal-nodes-worker
            if ($LASTEXITCODE -ne 0 -or $nodes -ne '[]') { throw 'An unconfigured cluster should have no peer rows' }
          } finally {
            Stop-Process -Id $daemon.Id -ErrorAction SilentlyContinue
            $daemon.WaitForExit()
            Remove-Item -LiteralPath $root.FullName -Force -Recurse
          }
      - name: Verify macOS Drive and session tree
        if: runner.os == 'macOS'
        run: >-
          cargo test --locked --manifest-path gui/Cargo.toml --bin remuda-gui
          -- drive_and_bus_open_the_same_reader_across_layouts
          peer_branches_fold_independently_and_preserve_the_preview
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          ./gui/target/debug/${{ matrix.executable }} --internal-build-id
          ./gui/target/debug/${{ matrix.executable }} --internal-font-check
          ./target/debug/${{ matrix.cli }} browser --help
          ./target/debug/${{ matrix.cli }} tray --help
          mkdir browser-artifact
          cp ./gui/target/debug/${{ matrix.executable }} ./target/debug/${{ matrix.cli }} browser-artifact/
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./gui/target/debug/${{ matrix.executable }} --internal-build-id
          if ($LASTEXITCODE -ne 0) { throw "GUI build-ID probe exited with $LASTEXITCODE" }
          & ./target/debug/${{ matrix.cli }} browser --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help exited with $LASTEXITCODE" }
          & ./target/debug/${{ matrix.cli }} tray --help
          if ($LASTEXITCODE -ne 0) { throw "Tray help exited with $LASTEXITCODE" }
          New-Item -ItemType Directory browser-artifact
          Copy-Item ./gui/target/debug/${{ matrix.executable }}, ./target/debug/${{ matrix.cli }} browser-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: remuda-browser-${{ matrix.platform }}
          path: browser-artifact/
          if-no-files-found: error
