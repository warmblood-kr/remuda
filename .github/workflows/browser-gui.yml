name: browser-gui

on:
  pull_request:
    paths: &browser_paths
      - '.github/workflows/browser-gui.yml'
      - 'gui/**'
      - 'core/**'
      - 'native/**'
      - 'vendor/**'
      - 'Cargo.*'
  push:
    branches: [main]
    paths: *browser_paths

jobs:
  build:
    name: Build Browser for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            executable: remuda-gui
            cli: remuda
          - platform: windows-x64
            runner: windows-latest
            executable: remuda-gui.exe
            cli: remuda.exe
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --locked --manifest-path gui/Cargo.toml
      - run: cargo build --locked -p remuda-native --bin remuda
      - if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path gui/Cargo.toml --bin remuda-gui bus_document_reuses_one_tab_beside_the_terminal
      - shell: bash
        run: |
          ./gui/target/debug/${{ matrix.executable }} --internal-build-id
          ./target/debug/${{ matrix.cli }} browser --help
          mkdir browser-artifact
          cp ./gui/target/debug/${{ matrix.executable }} ./target/debug/${{ matrix.cli }} browser-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: remuda-browser-${{ matrix.platform }}
          path: browser-artifact/
          if-no-files-found: error
