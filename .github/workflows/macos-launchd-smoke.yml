name: macos-launchd-smoke

# Manual only. docs/install-butler.sh's Darwin branch (docs/install-butler.sh
# around line 315) only ever PRINTS `launchctl bootstrap ...` as a step for a
# human to run -- nobody has ever actually run it against the plist the script
# writes, so it is untested whether launchd accepts it. This job runs the real
# installer end to end on a real macOS runner and then does the bootstrap for
# real, checking the plist and the loaded-agent state.
#
# Deliberately workflow_dispatch only -- no push/pull_request trigger. The
# reboot-survival leg (OnBootSec after an actual reboot) is explicitly out of
# scope here; this only proves the plist is well-formed and loads right now.

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: negative control — plutil -lint must reject a malformed plist
        run: |
          set -eu
          scratch="$RUNNER_TEMP/broken.plist"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n<key>Label</key>\n<string>broken\n' >"$scratch"
          if plutil -lint "$scratch"; then
            rm -f "$scratch"
            echo "::error::plutil -lint ACCEPTED a truncated/invalid plist -- this smoke test cannot trust plutil -lint on the real plist either"
            exit 1
          fi
          rm -f "$scratch"
          echo "negative control ok: plutil -lint correctly rejected the malformed scratch plist"

      - name: install remuda core (nightly, the only published channel)
        run: |
          set -eu
          REMUDA_CHANNEL=nightly sh docs/install.sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: stub token/config, then run docs/install-butler.sh for real
        # Fake but syntactically-valid Matrix values: no real Matrix traffic
        # needs to succeed for this job, only install + mod install + register
        # + the OS-specific persistence file (docs/install-butler.sh line 85-86
        # for the required files, line 134 for the exec-and-register step).
        run: |
          set -eu
          # The runner has no claude; butler's session spawns one (#164).
          # A stub that stays alive is enough: the install path is under test.
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec sleep 86400\n' >"$HOME/.local/bin/claude"
          chmod +x "$HOME/.local/bin/claude"
          mkdir -p "$HOME/.config/remuda/butler"
          printf 'ci-smoke-test-fake-token\n' >"$HOME/.config/remuda/butler/token"
          printf 'http://127.0.0.1:1\n!fakeroom:example.org\n@butler:example.org\n@allowed:example.org\n' >"$HOME/.config/remuda/butler/config"
          sh docs/install-butler.sh

      - name: confirm the real plist landed and is well-formed
        run: |
          set -eu
          plutil -lint "$HOME/Library/LaunchAgents/kr.warmblood.remuda.butler.plist"

      - name: launchctl bootstrap the agent for real
        run: |
          set -eu
          launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/kr.warmblood.remuda.butler.plist"

      - name: confirm launchd actually loaded the agent
        run: |
          set -eu
          # An interval job idles as 'not running' between runs, so state
          # alone proves nothing: run it once and require a clean exit.
          label="gui/$(id -u)/kr.warmblood.remuda.butler"
          launchctl print "$label" >/dev/null
          launchctl kickstart "$label"
          for _ in $(seq 20); do
            out=$(launchctl print "$label")
            echo "$out" | grep -Eq 'last exit code = 0$' && { echo "$out"; exit 0; }
            sleep 0.5
          done
          echo "$out"
          echo "::error::the loaded agent did not run to a clean exit (last exit code != 0)"; exit 1

      - name: cleanup — bootout the agent
        # Hygiene, not load-bearing: the runner is destroyed right after this
        # job regardless, so a failure here must never fail the job.
        if: always()
        run: launchctl bootout "gui/$(id -u)/kr.warmblood.remuda.butler" || true
