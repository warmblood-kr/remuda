[workspace]
resolver = "2"
members = ["core", "native"]

# WHY A WORKSPACE, AND NOT A FEATURE FLAG.
#
# 정수님, 2026-09-09: "좋은 아키텍처를 유지하기 위해서, 정적 코드분석 도구를
# 사용합니다. 그리고 아키텍처 린터 ... 그걸 린터처럼 빌드마다 체크합니다."
#
# The first cut of this crate separated pure policy from host code with a Cargo
# FEATURE (`native`). That was weaker than it looked, and the measurement is in
# `core/Cargo.toml`: the wasm target catches a host *crate*, but a bare
# `Command` or `Instant` written straight into the pure layer compiled clean.
#
# A crate boundary is not a rule — it is arithmetic. `remuda-core` does not list
# a single host dependency, so it CANNOT reference one; there is no flag to
# forget and no lint to silence. The layering is now enforced by cargo itself:
#
#     remuda-core     pure policy. no host deps. builds for wasm32.
#     remuda-native   pty, processes, terminal emulation. depends on core.
#
# The dependency arrow points one way and cargo rejects the other, which is the
# property a linter can only ask for politely.
# See the design doc: "컴파일러가 강제할 수 있는 경계는 린터에게 맡기지 않는다."

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.clippy]
# R15's actual subject: keep any one unit from growing without bound. These are
# the shape checks cargo can make on every build; CI runs clippy with `-D
# warnings`, so crossing one FAILS THE BUILD rather than printing advice.
too_many_arguments = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
