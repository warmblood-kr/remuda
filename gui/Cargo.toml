[package]
name = "remuda-gui"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
gpui = { version = "=0.2.2", default-features = false }
libc = "0.2"
remuda-core = { path = "../core" }
remuda-native = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
objc2 = "0.6"
raw-window-handle = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem",
    "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton",
    "NSStatusItem", "NSView", "NSScreen", "NSWindow", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
[patch.crates-io]
portable-pty = { path = "../vendor/portable-pty" }
