[package]
name = "remuda-gui"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false }
gpui-kit = { version = "=0.11.0", default-features = false }
libc = "0.2"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
png = "0.18"
smallvec = "1"
tempfile = "3"
remuda-core = { path = "../core" }
remuda-native = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSApplication", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem",
    "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton",
    "NSStatusItem", "NSView", "NSScreen", "NSWindow", "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSString"] }
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }
[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.14", default-features = false, features = ["test-support"] }
gpui-kit = { version = "=0.11.0", default-features = false, features = ["test-support"] }
[patch.crates-io]
portable-pty = { path = "../vendor/portable-pty" }

[build-dependencies]
embed-resource = "3.0.12"
