[package]
name = "remuda-gui"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
gpui-component = "=0.5.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
portable-pty = "=0.9.0"
vt100 = "=0.16.2"
remuda-core = { path = "../core" }
remuda-native = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
[patch.crates-io]
portable-pty = { path = "../vendor/portable-pty" }
