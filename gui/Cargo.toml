[package]
name = "remuda-gui"
version = "0.1.0"
edition = "2021"
[workspace]
[dependencies]
gpui = { version = "=0.2.2", default-features = false }
libc = "0.2"
remuda-core = { path = "../core" }
remuda-native = { path = "../native" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["test-support"] }
[patch.crates-io]
portable-pty = { path = "../vendor/portable-pty" }
